<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital receipts | Smart Farmer Portal</title>
  <link rel="icon" href="assets/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="site-nav"></div>

<div class="page-head no-print">
  <div class="container">
    <h1>Digital receipts</h1>
    <p>Every completed procurement has a receipt with a unique transaction number.</p>
  </div>
</div>

<div class="container pb-5">
  <div class="row g-4">
    <div class="col-lg-4 no-print">
      <div class="card p-3">
        <label class="form-label" for="receipt-search">Your receipts</label>
        <input type="search" class="form-control mb-3" id="receipt-search" placeholder="Search by number or crop">
        <div id="receipt-list" style="max-height:60vh;overflow-y:auto">Loading…</div>
      </div>
    </div>

    <div class="col-lg-8">
      <div id="receipt-view">
        <div class="empty-state"><i class="bi bi-receipt"></i>Select a receipt from the list to view it.</div>
      </div>
    </div>
  </div>
</div>

<div id="site-footer" class="no-print"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/receipts.js"></script>
</body>
</html>
