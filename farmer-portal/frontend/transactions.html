<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transaction history | Smart Farmer Portal</title>
  <link rel="icon" href="assets/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="site-nav"></div>

<div class="page-head">
  <div class="container">
    <h1>Transaction history</h1>
    <p>Every completed procurement, with the amount and the receipt.</p>
  </div>
</div>

<div class="container pb-5">
  <div class="card p-3 p-md-4 mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-4">
        <label class="form-label" for="t-search">Search</label>
        <input type="search" class="form-control" id="t-search" placeholder="Transaction number, crop or centre">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label" for="t-crop">Crop</label>
        <select class="form-select" id="t-crop"><option value="">All crops</option></select>
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label" for="t-from">From date</label>
        <input type="date" class="form-control" id="t-from">
      </div>
      <div class="col-6 col-md-2">
        <label class="form-label" for="t-to">To date</label>
        <input type="date" class="form-control" id="t-to">
      </div>
      <div class="col-6 col-md-2">
        <button class="btn btn-outline-farm w-100" id="t-clear">Clear filters</button>
      </div>
    </div>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-sm-6 col-lg-4"><div class="card stat-card p-3">
      <span class="stat-value" id="t-count">–</span><span class="stat-label">Transactions shown</span></div></div>
    <div class="col-sm-6 col-lg-4"><div class="card stat-card amber p-3">
      <span class="stat-value" id="t-total">–</span><span class="stat-label">Total amount</span></div></div>
    <div class="col-lg-4"><div class="card stat-card soil p-3">
      <span class="stat-value" id="t-latest">–</span><span class="stat-label">Latest transaction date</span></div></div>
  </div>

  <div class="card p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Transaction</th><th>Date</th><th>Crop</th><th>Quantity</th>
            <th>Centre</th><th class="text-end">Amount</th><th>Status</th><th>Receipt</th>
          </tr>
        </thead>
        <tbody id="t-body">
          <tr><td colspan="8" class="text-center py-4 text-muted">Loading transactions…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/transactions.js"></script>
</body>
</html>
