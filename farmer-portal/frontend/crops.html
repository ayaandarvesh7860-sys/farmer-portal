<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crop information | Smart Farmer Portal</title>
  <link rel="icon" href="assets/logo.svg">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
<div id="site-nav"></div>

<div class="page-head">
  <div class="container">
    <h1>Crop information</h1>
    <p>Season, soil, irrigation, harvesting, storage and common problems for each crop.</p>
  </div>
</div>

<div class="container pb-5">
  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card p-3">
        <label class="form-label" for="crop-select">Choose a crop</label>
        <select class="form-select mb-3" id="crop-select"><option>Loading…</option></select>
        <div id="crop-buttons" class="d-flex flex-wrap gap-2"></div>
      </div>
    </div>
    <div class="col-lg-8">
      <div id="crop-detail">
        <div class="empty-state"><i class="bi bi-flower1"></i>Select a crop to read its guide.</div>
      </div>
    </div>
  </div>
</div>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/components.js"></script>
<script src="js/crops.js"></script>
</body>
</html>
